<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="text-center">To-Do List</h1>
    </header>

    <main class="todo-container d-flex flex-column">
        <!-- form that allows the addition of a new task -->
        <section id="formSection" class="d-flex justify-content-center align-self-center">
            <form id="form" class="d-flex align-items-center">
                
                <label for="task">New task:</label>
                
                <!-- O Trabalho a ser feito id=task -->
                <input id="task" type="text" placeholder="New task">
    
                <label for="category">Category:</label>
                
                <!-- Categorias id=category-->
                <select name="category" id="category">
                    <option value="chores">House chores</option>
                    <option value="school">School</option>
                    <option value="work">Work</option>
                </select>
                
                <!-- Botão -->
                <input type="submit" id="buton" class="btn btn-secondary" value="Add"/>  
            </form>
        </section>

        <!-- task list -->
        <section id="listSection" class="d-flex justify-content-center align-items-center">
            <ul id="list" class="w-50 d-flex flex-column align-items-center ">

                <!-- add tasks here through javascript -->

            </ul>
        </section>

    <!-- formulario de confirmação -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        
        <div class="modal-header">
          <p class="modal-title" id="registerModalLabel">Marking this task as complete will result in its removal. Do you wish to proceed?</p>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-footer">
           <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#registerModal">Cancelar</button>
           <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#registerModal" onclick="sim(true)">OK</button>
        </div>
      </div>
    </div>
    </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
