<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="ex1.css">
    <script src="ex1.js"></script>
</head>
<body>
    <main>
        <div class="calculator">
            <input type="button" onclick="zero()" value="0">
            <input type="button" onclick="um()"value="1">
            <input type="button" onclick="dois()"value="2">
            <input type="button" onclick="tres()"value="3">
            <input type="button" onclick="quatro()"value="4">
            <input type="button" onclick="cinco()"value="5">
            <input type="button" onclick="seis()"value="6">
            <input type="button"onclick="sete()" value="7">
            <input type="button" onclick="oito()"value="8">
            <input type="button" onclick="nove()"value="9">
            <input id="add" type="button"onclick="mais()" value="+">
            <input id="equal" type="button"onclick="igual()" value="=">
        </div>
    </main>

    <script src="ex1.js"></script>
</body>
</html>
