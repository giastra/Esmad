<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 4 - Login/Registo</title>
</head>
<body class="container mt-5">

  <h2>Gestão de Utilizadores 🔑</h2>

  <!-- Formulário -->
  <form id="userForm" class="mt-3">
    <div>
      <label>Nome:</label>
      <input type="text" id="name" required>
    </div>
    <div>
      <label>Username:</label>
      <input type="text" id="username" required>
    </div>
    <div>
      <label>Email:</label>
      <input type="email" id="email" required>
    </div>
    <div>
      <label>Password:</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" id="butao">Entrar / Registar</button>
  </form>

  <!-- Resultado -->
  <div id="mensagem" class="mt-4"></div>

  <script src="script12.js"></script>
</body>
</html>
