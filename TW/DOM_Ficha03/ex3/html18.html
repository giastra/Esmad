<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <h2>Compra de Bilhetes</h2>
    <form class="mt-3">
    
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input type="text" class="form-control" id="nome" required>
    </div>

    
    <div class="mb-3">
      <label for="filme" class="form-label">Filme</label>
      <select id="filme" class="form-select" required>
        <option value="Dune">Dune</option>
        <option value="Matrix">Matrix</option>
        <option value="Avatar">Avatar</option>
      </select>
    </div>

    
    <div class="mb-3">
      <label for="bilhetes" class="form-label">Número de Bilhetes</label>
      <input type="number" class="form-control" id="bilhetes" min="1" required>
    </div>

    
    <div class="mb-3">
      <label class="form-label">Horário</label><br>
      <input type="radio" name="horario" value="18h00" required> 18h00
      <input type="radio" name="horario" value="21h30"> 21h30
      <input type="radio" name="horario" value="23h00"> 23h00
    </div>

    <button type="submit" id='butao' class="btn btn-primary">Comprar</button>
    </form>

    <div id="rest" class="mt-4"></div>
    <script src="script11.js"></script>
</body>
</html>
